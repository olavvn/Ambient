streaming:
  chunk_size: 128
  context_len: 512
  queue_maxsize: 4
  device: "cuda"

audio:
  sample_rate: 44100
  channels: 1
  buffer_size: 1024
  crossfade_ms: 200

fluidsynth:
  soundfont: "data/soundfonts/FluidR3_GM.sf2"
  reverb: true
  reverb_room: 0.8
  reverb_wet: 0.4
  chorus: false
  gain: 0.7

midi_input:
  port: null
  buffer_sec: 2.0

transition:
  strategy: "bar_boundary"
  max_wait_bars: 4
