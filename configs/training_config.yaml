pretrained:
  base_model: "stanford-crfm/music-medium-800k"
  resize_embeddings: true
  reinit_embeddings: true

data:
  train_dir: "data/processed/train"
  val_dir: "data/processed/val"
  num_workers: 4

phase1:
  description: "임베딩 적응"
  epochs: 5
  lr: 1.0e-3
  freeze_backbone: true
  batch_size: 16
  warmup_steps: 500

phase2:
  description: "전체 파인튜닝"
  epochs: 25
  lr_embedding: 1.0e-4
  lr_backbone: 1.0e-5
  freeze_backbone: false
  batch_size: 8
  gradient_accumulation: 4
  warmup_steps: 1000

common:
  optimizer: AdamW
  weight_decay: 0.01
  betas: [0.9, 0.95]
  lr_schedule: cosine
  gradient_clip: 1.0
  label_smoothing: 0.1
  seq_len: 2048

output:
  checkpoint_dir: "checkpoints"
  save_every: 5
